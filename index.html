<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#19c3ff">
<title>Marble Rush</title>
<style>
html,body{margin:0;height:100%;background:#0b2236;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
#out{display:none}

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<pre id="out"></pre>
<script>
(()=>{
'use strict';
/* ================= COSTANTI ================= */
const W=540, HB=700;            // larghezza logica, altezza area di gioco
let H=1000;
const R=19, D=38;                // raggio / diametro biglia
const STEP=2, GAPT=12, CLOSE=320, RUSH=250;
const COLORS=[
 ['#2fb8ff','#c4f0ff','#0a6fb3'],
 ['#44d63a','#ccffbc','#168a1a'],
 ['#b04cf2','#efcaff','#6a1fa8'],
 ['#ff9a1f','#ffe3ae','#b45a00'],
 ['#f03a3a','#ffc4c4','#9a1212'],
 ['#ffe83f','#fffcc4','#b59a00']
];
const ITEM_NAMES={fire:'Palla di fuoco',wild:'Jolly arcobaleno',bomb:'Bomba'};

/* ================= PERCORSI ================= */
function waves(){
  const p=[]; const amp=52, per=Math.PI*4;
  for(let x=-40;x<=480;x+=18) p.push([x,100+amp*Math.sin((x+40)/520*per)]);
  let last=p[p.length-1]; p.push([525,(last[1]+270)/2]);
  for(let x=480;x>=40;x-=18) p.push([x,270+amp*Math.sin((480-x)/440*per)]);
  last=p[p.length-1]; p.push([15,(last[1]+440)/2]);
  for(let x=40;x<=300;x+=18) p.push([x,440+amp*Math.sin((x-40)/440*per)]);
  return p;
}
const TEMPLATES=[
 {pts:[[-40,50],[440,50],[490,100],[490,600],[440,650],[100,650],[50,600],[50,160],[100,110],[380,110],[430,160],[430,540],[380,590],[160,590],[110,540],[110,260],[160,210],[300,210]],shooter:[270,400],r:50},
 {pts:[[-40,50],[490,50],[490,640],[50,640],[50,150],[400,150],[400,540],[150,540],[150,250],[300,250]],shooter:[275,395],r:50},
 {pts:[[-40,40],[480,40],[480,155],[60,155],[60,270],[480,270],[480,385],[60,385],[60,500],[330,500]],shooter:[330,620],r:55},
 {pts:null,gen:waves,shooter:[270,610],r:60},
 {pts:[[-40,30],[490,110],[50,190],[490,270],[50,350],[490,430],[50,510],[490,590],[300,650]],shooter:[110,640],r:70}
];
let PX=[],PY=[],TX=[],TY=[],PN=0,PLEN=0;
function buildPath(pts,radius){
  const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
    const r=Math.min(radius,l1/2,l2/2);
    const p0=[b[0]+(a[0]-b[0])/l1*r,b[1]+(a[1]-b[1])/l1*r];
    const p1=[b[0]+(c[0]-b[0])/l2*r,b[1]+(c[1]-b[1])/l2*r];
    out.push(p0);
    for(let k=1;k<12;k++){const t=k/12,u=1-t;out.push([u*u*p0[0]+2*u*t*b[0]+t*t*p1[0],u*u*p0[1]+2*u*t*b[1]+t*t*p1[1]]);}
    out.push(p1);
  }
  out.push(pts[pts.length-1]);
  const cum=[0];
  for(let i=1;i<out.length;i++)cum.push(cum[i-1]+Math.hypot(out[i][0]-out[i-1][0],out[i][1]-out[i-1][1]));
  const total=cum[cum.length-1];
  PX=[];PY=[];TX=[];TY=[];
  let j=0;
  for(let s=0;s<=total;s+=STEP){
    while(j<cum.length-2&&cum[j+1]<s)j++;
    const seg=cum[j+1]-cum[j]||1,f=(s-cum[j])/seg;
    PX.push(out[j][0]+(out[j+1][0]-out[j][0])*f);
    PY.push(out[j][1]+(out[j+1][1]-out[j][1])*f);
  }
  PN=PX.length;
  for(let i=0;i<PN;i++){
    const a=Math.max(0,i-2),b=Math.min(PN-1,i+2);
    let dx=PX[b]-PX[a],dy=PY[b]-PY[a];const l=Math.hypot(dx,dy)||1;TX.push(dx/l);TY.push(dy/l);
  }
  PLEN=(PN-1)*STEP;
}
function place(b){
  const d=b.d+b.off;
  if(d<=0){b.x=PX[0]+TX[0]*d;b.y=PY[0]+TY[0]*d;b.tx=TX[0];b.ty=TY[0];return;}
  let f=d/STEP,i=Math.floor(f);
  if(i>=PN-1){b.x=PX[PN-1];b.y=PY[PN-1];b.tx=TX[PN-1];b.ty=TY[PN-1];return;}
  f-=i;
  b.x=PX[i]+(PX[i+1]-PX[i])*f;b.y=PY[i]+(PY[i+1]-PY[i])*f;b.tx=TX[i];b.ty=TY[i];
}

/* ================= DIFFICOLTA' ================= */
// Ogni livello vinto rende il successivo piu' duro:
//  - piu' colori (3 -> 6), piu' biglie (35 -> 130), catena piu' veloce (24 -> 85 px/s)
//  - meno "serie" di colori uguali gia' pronte (piu' caos)
//  - dal livello 8 compaiono accelerazioni improvvise, sempre piu' frequenti
//  - i 5 percorsi si alternano; quelli corti lasciano meno margine
function levelParams(L){
  return {
    colors:Math.min(3+Math.floor((L-1)/4),6),
    n:Math.min(30+5*L,130),
    speed:Math.min(22+2.2*L,85),
    repeat:Math.max(0.5-0.025*L,0.12),
    surge:L>=8?Math.max(22-(L-8)*0.6,8):0,
    rushBalls:Math.min(12+Math.floor(L/2),26)
  };
}
function genSeq(n,colors,repeat){
  const s=[];
  for(let i=0;i<n;i++){
    let c;
    if(i>0&&Math.random()<repeat)c=s[i-1];else c=(Math.random()*colors)|0;
    if(i>=2&&s[i-1]===s[i-2]&&c===s[i-1])c=(c+1+((Math.random()*(colors-1))|0))%colors;
    s.push(c);
  }
  return s;
}

/* ================= STATO ================= */
let save={level:1,best:0,items:{fire:2,wild:2,bomb:2},sound:true};
try{const j=JSON.parse(localStorage.getItem('marblerush1'));if(j){save=Object.assign(save,j);save.items=Object.assign({fire:2,wild:2,bomb:2},j.items||{});}}catch(e){}
function store(){try{localStorage.setItem('marblerush1',JSON.stringify(save));}catch(e){}}

let mode='menu';        // menu | intro | play | pause | win | lose
let G=null;             // stato livello
let balls=[],projs=[],parts=[],pops=[];
let score=0,score0=0,t=0,tpl=0;
let PY0=150;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,dpr=1,bg=null,sprites=[];

function newLevel(L){
  const P=levelParams(L);
  tpl=(L-1)%TEMPLATES.length;
  const T=TEMPLATES[tpl];
  buildPath(T.gen?T.gen():T.pts,T.r);
  balls=[];projs=[];parts=[];pops=[];
  G={L,P,seq:genSeq(P.n,P.colors,P.repeat),spawned:0,feed:D,destroyed:0,
     sx:T.shooter[0],sy:T.shooter[1],ang:-Math.PI/2,cd:0,armed:null,chain:0,
     surgeIn:P.surge?P.surge*(0.7+Math.random()*0.6):1e9,surgeT:0,shake:0,t:0,endT:0,
     cur:0,next:0,bonus:null,stars:0};
  G.cur=pickColor();G.next=pickColor();
  score0=score;
  buildBg();
}
function pickColor(){
  const present=new Set();
  for(const b of balls)if(b.d>0&&b.color<6)present.add(b.color);
  const arr=[...present];
  if(!arr.length||Math.random()<0.08){
    return (Math.random()*G.P.colors)|0;
  }
  return arr[(Math.random()*arr.length)|0];
}

/* ================= AUDIO ================= */
let AC=null;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d,type,v,slide){
  if(!save.sound||!AC)return;
  try{
    const tt=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,tt);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),tt+d);
    g.gain.setValueAtTime(v||.1,tt);g.gain.exponentialRampToValueAtTime(.001,tt+d);
    o.connect(g);g.connect(AC.destination);o.start(tt);o.stop(tt+d);
  }catch(e){}
}
const sfx={
  shoot(){tone(520,.09,'triangle',.09,-220);},
  hit(){tone(220,.07,'sine',.09,-60);},
  pop(n){tone(420+n*70,.16,'square',.05,320);},
  boom(){tone(150,.45,'sawtooth',.12,-110);},
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.1),i*130));},
  lose(){[330,262,196,147].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.08),i*160));}
};
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

/* ================= LOGICA CATENA ================= */
function touching(i,j){return balls[i].d-balls[j].d<=D+GAPT;}
function newBall(color,d,orig){return {color,d,orig:!!orig,off:0,wasGap:false,sx:0,sy:0,x:0,y:0,tx:1,ty:0};}

function removeIdx(list){ // list: indici ordinati crescenti
  for(let k=list.length-1;k>=0;k--){
    const b=balls[list[k]];
    burst(b.x,b.y,b.color,8);
    if(b.orig)G.destroyed++;
    balls.splice(list[k],1);
  }
  flagGaps();
}
function flagGaps(){
  for(let i=1;i<balls.length;i++)if(balls[i-1].d-D-balls[i].d>GAPT)balls[i].wasGap=true;
}
function checkMatch(idx,chain){
  const c=balls[idx].color;
  if(c>5)return 0;
  let lo=idx,hi=idx;
  while(lo>0&&balls[lo-1].color===c&&touching(lo-1,lo))lo--;
  while(hi<balls.length-1&&balls[hi+1].color===c&&touching(hi,hi+1))hi++;
  const cnt=hi-lo+1;
  if(cnt<3)return 0;
  const mid=balls[(lo+hi)>>1];
  const pts=cnt*10*(1+chain)+(cnt-3)*10;
  addScore(pts,mid.x,mid.y,chain>0?('COMBO x'+(chain+1)):null);
  const list=[];for(let i=lo;i<=hi;i++)list.push(i);
  removeIdx(list);
  sfx.pop(chain);vib(12);
  return cnt;
}
function addScore(p,x,y,label){
  score+=p;
  pops.push({x,y,txt:'+'+p,life:1,c:'#fff'});
  if(label)pops.push({x,y:y-26,txt:label,life:1.3,c:'#ffe83f'});
}
function burst(x,y,c,n){
  const col=COLORS[Math.min(c,5)][0];
  for(let i=0;i<n;i++){
    const a=Math.random()*7,s=60+Math.random()*180;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.5+Math.random()*.4,c:col,r:2+Math.random()*3});
  }
}
function explode(x,y,rad,type){
  const list=[];
  for(let i=0;i<balls.length;i++){
    if(balls[i].d>0&&Math.hypot(balls[i].x-x,balls[i].y-y)<=rad)list.push(i);
  }
  for(let k=0;k<22;k++){const a=Math.random()*7,s=80+Math.random()*260;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.4,c:type==='fire'?'#ff8a1f':'#555',r:3+Math.random()*4});}
  if(list.length){
    addScore(list.length*15,x,y,type==='fire'?'FUOCO!':'BOOM!');
    removeIdx(list);
  }
  G.shake=type==='bomb'?.5:.25;
  sfx.boom();vib(40);
}

function onHit(pr,j){
  const hb=balls[j];
  if(pr.type==='fire'){explode(hb.x,hb.y,66,'fire');return;}
  if(pr.type==='bomb'){explode(hb.x,hb.y,118,'bomb');return;}
  const wx=pr.x-hb.x,wy=pr.y-hb.y;
  const front=(wx*hb.tx+wy*hb.ty)>0;
  const k=front?j:j+1;
  let d;
  if(k>=balls.length)d=balls[k-1].d-D;else d=balls[k].d+D;
  const nb=newBall(pr.color,d);
  balls.splice(k,0,nb);
  for(let i=k-1;i>=0;i--){
    const need=balls[i+1].d+D;
    if(balls[i].d<need){const dl=need-balls[i].d;balls[i].d=need;balls[i].off-=dl;}else break;
  }
  place(nb);
  nb.sx=pr.x-nb.x;nb.sy=pr.y-nb.y;
  if(pr.type==='wild'){
    let best=-1,bc=-1;
    const cands=new Set();
    if(k>0)cands.add(balls[k-1].color);
    if(k<balls.length-1)cands.add(balls[k+1].color);
    for(const c of cands){
      if(c>5)continue;
      nb.color=c;
      let lo=k,hi=k;
      while(lo>0&&balls[lo-1].color===c&&touching(lo-1,lo))lo--;
      while(hi<balls.length-1&&balls[hi+1].color===c&&touching(hi,hi+1))hi++;
      if(hi-lo+1>best){best=hi-lo+1;bc=c;}
    }
    if(bc>=0)nb.color=bc;else nb.color=(Math.random()*G.P.colors)|0;
  }
  sfx.hit();
  G.chain=0;
  checkMatch(k,0);
}

function fire(){
  if(mode!=='play'||G.cd>0)return;
  let type='normal';
  if(G.armed&&save.items[G.armed]>0){type=G.armed;save.items[G.armed]--;store();}
  G.armed=null;
  const a=G.ang;
  projs.push({x:G.sx+Math.cos(a)*30,y:G.sy+Math.sin(a)*30,dx:Math.cos(a),dy:Math.sin(a),color:G.cur,type,dead:false});
  G.cur=G.next;G.next=pickColor();
  G.cd=.2;sfx.shoot();
}
function swap(){if(mode!=='play')return;const c=G.cur;G.cur=G.next;G.next=c;sfx.hit();}

function updateChain(dt){
  const P=G.P;
  let hasGap=false;
  for(let i=1;i<balls.length;i++)if(balls[i-1].d-balls[i].d-D>GAPT){hasGap=true;break;}
  let v=P.speed;
  const rush=G.spawned<P.rushBalls||balls.length===0||balls[0].d<180;
  if(rush)v=RUSH;
  else{
    G.surgeIn-=dt;
    if(G.surgeIn<=0&&balls.length>8){G.surgeT=1.4;G.surgeIn=P.surge*(0.7+Math.random()*0.6);pops.push({x:W/2,y:200,txt:'ACCELERAZIONE!',life:1.4,c:'#ff6b6b',screen:true});}
    if(G.surgeT>0){G.surgeT-=dt;v*=2.2;}
  }
  if(!hasGap){
    if(balls.length)balls[0].d+=v*dt;
    if(G.spawned<P.n){
      G.feed+=v*dt;
      while(G.feed>=D&&G.spawned<P.n){
        let d=G.feed-D;
        if(balls.length)d=Math.min(d,balls[balls.length-1].d-D);
        const b=newBall(G.seq[G.spawned],d,true);
        balls.push(b);G.spawned++;G.feed-=D;
      }
    }
  }
  const pend=[];
  for(let i=1;i<balls.length;i++){
    const b=balls[i],p=balls[i-1];
    const g=p.d-D-b.d;
    if(g>0.01){
      if(g>GAPT)b.wasGap=true;
      const mv=Math.min(g,CLOSE*dt);
      b.d+=mv;
      if(b.wasGap&&g-mv<=0.01){b.wasGap=false;pend.push(b);}
    }else if(g<-0.01){b.d=p.d-D;}
  }
  for(const b of balls){
    b.off*=Math.exp(-12*dt);if(Math.abs(b.off)<.1)b.off=0;
    b.sx*=Math.exp(-18*dt);b.sy*=Math.exp(-18*dt);
    place(b);
  }
  for(const b of pend){
    const i=balls.indexOf(b);
    if(i>0&&balls[i-1].color===b.color&&balls[i-1].color<6){
      G.chain++;
      checkMatch(i,G.chain);
    }
  }
}
function updateProjs(dt){
  for(const pr of projs){
    let rem=1000*dt;
    while(rem>0&&!pr.dead){
      const st=Math.min(6,rem);rem-=st;
      pr.x+=pr.dx*st;pr.y+=pr.dy*st;
      const sy=pr.y+PY0;
      if(pr.x<-40||pr.x>W+40||sy<120||sy>H-80){pr.dead=true;break;}
      let bj=-1,bd=(D*.88)*(D*.88);
      for(let i=0;i<balls.length;i++){
        const b=balls[i];if(b.d<=0)continue;
        const dx=b.x-pr.x,dy=b.y-pr.y,dd=dx*dx+dy*dy;
        if(dd<bd){bd=dd;bj=i;}
      }
      if(bj>=0){pr.dead=true;onHit(pr,bj);}
    }
  }
  projs=projs.filter(p=>!p.dead);
}
function update(dt){
  t+=dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.life-=dt;p.y-=30*dt;}
  pops=pops.filter(p=>p.life>0);
  if(!G)return;
  if(G.shake>0)G.shake-=dt;
  if(mode==='intro'){G.t+=dt;if(G.t>1.4){mode='play';G.t=0;}return;}
  if(mode!=='play')return;
  G.t+=dt;
  if(G.cd>0)G.cd-=dt;
  updateChain(dt);
  updateProjs(dt);
  // sconfitta
  if(balls.length&&balls[0].d>=PLEN-4){
    mode='lose';G.endT=0;score=score0;sfx.lose();vib(200);
    for(let i=0;i<30;i++)parts.push({x:PX[PN-1],y:PY[PN-1],vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,life:.8,c:'#f03a3a',r:4});
  }
  // vittoria
  else if(G.spawned>=G.P.n&&balls.length===0){
    mode='win';G.endT=0;sfx.win();vib(60);
    const keys=['fire','wild','bomb'];const k=keys[(Math.random()*3)|0];
    save.items[k]++;G.bonus=k;
    save.level=Math.max(save.level,G.L+1);save.best=Math.max(save.best,score);store();
  }
}

/* ================= SPRITES / SFONDO ================= */
function makeSprites(){
  sprites=[];
  const s=scale*dpr,sz=D+6,px=Math.ceil(sz*s);
  for(let c=0;c<6;c++){
    const k=document.createElement('canvas');k.width=k.height=px;
    const g=k.getContext('2d');g.scale(px/sz,px/sz);g.translate(sz/2,sz/2);
    marbleRaw(g,c);sprites.push(k);
  }
}
function marbleRaw(g,c){
  const [b,l,d]=COLORS[c];
  g.fillStyle='rgba(70,35,0,.28)';g.beginPath();g.ellipse(2,4,R,R*.92,0,0,7);g.fill();
  const gr=g.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R);
  gr.addColorStop(0,l);gr.addColorStop(.4,b);gr.addColorStop(1,d);
  g.fillStyle=gr;g.beginPath();g.arc(0,0,R,0,7);g.fill();
  g.strokeStyle='rgba(0,0,0,.3)';g.fillStyle='rgba(0,0,0,.24)';g.lineWidth=3;g.lineJoin='round';
  g.beginPath();
  switch(c){
    case 0:g.arc(0,1,8,0,7);g.stroke();break;
    case 1:g.arc(0,1,5.5,0,7);g.fill();break;
    case 2:g.moveTo(0,-8);g.lineTo(8,1);g.lineTo(0,10);g.lineTo(-8,1);g.closePath();g.fill();break;
    case 3:g.moveTo(0,-8);g.lineTo(9,8);g.lineTo(-9,8);g.closePath();g.fill();break;
    case 4:g.moveTo(-8,-2);g.lineTo(8,-2);g.moveTo(-8,6);g.lineTo(8,6);g.stroke();break;
    case 5:for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*.8;g[i?'lineTo':'moveTo'](Math.cos(a)*9,1+Math.sin(a)*9);}g.closePath();g.fill();break;
  }
  g.fillStyle='rgba(255,255,255,.78)';g.beginPath();g.ellipse(-R*.38,-R*.42,R*.22,R*.13,-.7,0,7);g.fill();
}
function drawSprite(c,x,y,s){
  const sz=(D+6)*(s||1);ctx.drawImage(sprites[c],x-sz/2,y-sz/2,sz,sz);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function strokePath(g,w,col){
  g.lineWidth=w;g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.moveTo(PX[0],PY[0]);for(let i=1;i<PN;i+=2)g.lineTo(PX[i],PY[i]);g.lineTo(PX[PN-1],PY[PN-1]);g.stroke();
}
function buildBg(){
  bg=document.createElement('canvas');
  bg.width=Math.round(W*scale*dpr);bg.height=Math.round(H*scale*dpr);
  const g=bg.getContext('2d');g.scale(scale*dpr,scale*dpr);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#fde58a');gr.addColorStop(1,'#f6d06a');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // macchie / piastrelle
  let seed=G?G.L*97+13:5;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  g.fillStyle='rgba(255,255,255,.14)';
  for(let i=0;i<14;i++){
    const x=rnd()*W,y=150+rnd()*(H-250),r=40+rnd()*50;
    g.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3+.3;g[k?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r*.8);}g.closePath();g.fill();
  }
  g.fillStyle='rgba(130,90,20,.08)';
  for(let i=0;i<10;i++){const x=rnd()*W,y=150+rnd()*(H-250),r=20+rnd()*40;g.beginPath();g.ellipse(x,y,r,r*.6,0,0,7);g.fill();}
  // foglie
  g.fillStyle='#5cc04a';
  for(let i=0;i<5;i++){const x=rnd()*W,y=170+rnd()*(H-300);g.save();g.translate(x,y);g.rotate(rnd()*6);
    for(let k=0;k<5;k++){g.rotate(Math.PI*.4);g.beginPath();g.ellipse(0,-9,4,11,0,0,7);g.fill();}g.restore();}
  g.translate(0,PY0);
  // percorso
  strokePath(g,54,'rgba(110,70,10,.30)');
  strokePath(g,50,'#a8742c');
  strokePath(g,42,'#d9a04a');
  strokePath(g,32,'#cf9640');
  // frecce
  g.strokeStyle='rgba(120,70,10,.55)';g.lineWidth=4;g.lineCap='round';g.lineJoin='round';
  for(let d=140;d<PLEN-60;d+=150){
    const i=Math.floor(d/STEP),x=PX[i],y=PY[i],tx=TX[i],ty=TY[i];
    g.beginPath();g.moveTo(x-tx*4-ty*8,y-ty*4+tx*8);g.lineTo(x+tx*5,y+ty*5);g.lineTo(x-tx*4+ty*8,y-ty*4-tx*8);g.stroke();
  }
  // buco finale (pietra con gemma)
  const ex=PX[PN-1],ey=PY[PN-1];
  g.fillStyle='rgba(60,50,40,.35)';g.beginPath();g.ellipse(ex+3,ey+6,40,36,0,0,7);g.fill();
  const sg=g.createRadialGradient(ex-10,ey-12,5,ex,ey,42);sg.addColorStop(0,'#9aa5b5');sg.addColorStop(1,'#56607a');
  g.fillStyle=sg;g.beginPath();g.ellipse(ex,ey,40,36,0,0,7);g.fill();
  g.strokeStyle='#3d4658';g.lineWidth=3;g.stroke();
  g.fillStyle='#e23b3b';g.beginPath();g.moveTo(ex,ey-20);g.lineTo(ex+18,ey-5);g.lineTo(ex+11,ey+17);g.lineTo(ex-11,ey+17);g.lineTo(ex-18,ey-5);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.moveTo(ex-4,ey-14);g.lineTo(ex+8,ey-6);g.lineTo(ex-6,ey);g.closePath();g.fill();
}

/* ================= DISEGNO ================= */
function txt(s,x,y,size,col,align,stroke){
  ctx.font='800 '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke){ctx.lineWidth=size*.2;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function star(x,y,r,fill){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr_=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr_,y+Math.sin(a)*rr_);}
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(0,50,100,.5)';ctx.stroke();
}
function drawFrog(){
  const x=G.sx,y=G.sy+PY0;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(70,35,0,.25)';ctx.beginPath();ctx.ellipse(4,10,46,42,0,0,7);ctx.fill();
  ctx.rotate(G.ang+Math.PI/2);
  // zampe
  ctx.fillStyle='#3a9a3a';
  [[-1],[1]].forEach(([s])=>{
    ctx.beginPath();ctx.ellipse(s*33,22,14,20,s*.5,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(s*28,-16,10,14,-s*.4,0,7);ctx.fill();
  });
  // corpo
  const bgd=ctx.createRadialGradient(-10,-10,6,0,0,44);bgd.addColorStop(0,'#8be070');bgd.addColorStop(1,'#3a9a3a');
  ctx.fillStyle=bgd;ctx.beginPath();ctx.ellipse(0,2,35,40,0,0,7);ctx.fill();
  ctx.strokeStyle='#2c7a2c';ctx.lineWidth=3;ctx.stroke();
  // bocca
  ctx.fillStyle='#2c6e2c';ctx.beginPath();ctx.ellipse(0,-27,22,12,0,0,7);ctx.fill();
  // occhi
  [-1,1].forEach(s=>{
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*19,-10,10,0,7);ctx.fill();
    ctx.strokeStyle='#2c7a2c';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(s*19,-13,5,0,7);ctx.fill();
  });
  // pallina successiva (sulla schiena)
  drawBall(G.next,0,20,.62,null);
  // pallina in bocca
  drawBall(G.cur,0,-31,1,G.armed);
  ctx.restore();
}
function drawBall(c,x,y,s,special){
  if(special==='fire'||special==='bomb'||special==='wild'){drawSpecial(special,x,y,s||1);return;}
  drawSprite(c,x,y,s);
}
function drawSpecial(type,x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(type==='fire'){
    const g=ctx.createRadialGradient(0,0,2,0,0,R+8);g.addColorStop(0,'#fff6b0');g.addColorStop(.5,'#ff9a1f');g.addColorStop(1,'rgba(240,60,20,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R+8+Math.sin(t*20)*2,0,7);ctx.fill();
    ctx.fillStyle='#ff6a1a';ctx.beginPath();ctx.arc(0,0,R-3,0,7);ctx.fill();
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(-2,-2,R-10,0,7);ctx.fill();
  }else if(type==='bomb'){
    const g=ctx.createRadialGradient(-6,-7,2,0,0,R);g.addColorStop(0,'#6b7280');g.addColorStop(1,'#111827');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
    ctx.strokeStyle='#8a6d3b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(6,-R+2);ctx.quadraticCurveTo(12,-R-6,16,-R-4);ctx.stroke();
    ctx.fillStyle='#ffb020';ctx.beginPath();ctx.arc(16,-R-4,3+Math.sin(t*25),0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='800 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✕',0,1);
  }else{
    const cols=['#ff4d4d','#ffb020','#ffe83f','#44d63a','#2fb8ff','#b04cf2'];
    const rot=t*3;
    for(let i=0;i<6;i++){ctx.fillStyle=cols[i];ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,rot+i*Math.PI/3,rot+(i+1)*Math.PI/3);ctx.closePath();ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.ellipse(-R*.38,-R*.42,R*.22,R*.13,-.7,0,7);ctx.fill();
  }
  ctx.restore();
}
function rayHit(){
  // anteprima mira: fino alla prima biglia
  const a=G.ang,dx=Math.cos(a),dy=Math.sin(a);
  let x=G.sx+dx*34,y=G.sy+dy*34,len=0;
  const pts=[];
  while(len<760){
    x+=dx*8;y+=dy*8;len+=8;
    if(x<0||x>W||y+PY0<130||y+PY0>H-100)break;
    let hit=false;
    for(const b of balls){if(b.d>0&&Math.hypot(b.x-x,b.y-y)<D*.88){hit=true;break;}}
    if(hit)break;
    if(len>40&&(len/8)%2===0)pts.push([x,y]);
  }
  return {pts,x,y};
}
function drawWorld(){
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-.5)*10*G.shake,(Math.random()-.5)*10*G.shake);
  ctx.drawImage(bg,0,0,W,H);
  ctx.translate(0,PY0);
  // pericolo
  if(balls.length&&balls[0].d>PLEN-520){
    const k=(balls[0].d-(PLEN-520))/520,ex=PX[PN-1],ey=PY[PN-1];
    ctx.fillStyle='rgba(255,40,40,'+(.25+.25*Math.sin(t*10))*k+')';
    ctx.beginPath();ctx.arc(ex,ey,70+Math.sin(t*10)*6,0,7);ctx.fill();
  }
  // biglie (dal fondo verso la testa)
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    if(b.d<-D)continue;
    drawSprite(b.color,b.x+b.sx,b.y+b.sy,1);
  }
  ctx.translate(0,-PY0);
  // mira
  if(mode==='play'){
    const r=rayHit();
    ctx.fillStyle='rgba(120,40,160,.55)';
    for(const p of r.pts){ctx.beginPath();ctx.arc(p[0],p[1]+PY0,3,0,7);ctx.fill();}
  }
  drawFrog();
  ctx.translate(0,PY0);
  // proiettili
  for(const p of projs){
    if(p.type==='normal')drawSprite(p.color,p.x,p.y,1);else drawSpecial(p.type,p.x,p.y,1);
  }
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of pops){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));
    txt(p.txt,p.x,p.screen?p.y-PY0:p.y,p.screen?34:24,p.c,'center','rgba(0,0,0,.55)');
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

      ctx.globalAlpha=1;

/* ================= INPUT ================= */
let down=false,downOnFrog=false;
function toL(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
function aimAt(x,y){
  G.ang=Math.atan2(y-PY0-G.sy,x-G.sx);
}
function hitBtn(x,y){for(const b of BTN)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b.id;return null;}
function press(id){
  audio();
  switch(id){
    case 'play':startGame(save.level);break;
    case 'restart':score=0;save.level=1;store();startGame(1);break;
    case 'sound':save.sound=!save.sound;store();break;
    case 'resume':mode='play';break;
    case 'menu':mode='menu';break;
    case 'next':startGame(G.L+1);break;
    case 'retry':startGame(G.L);break;
    case 'pause':if(mode==='play')mode='pause';break;
    case 'fire':case 'wild':case 'bomb':
      if(mode==='play'||mode==='intro'){
        if(save.items[id]>0)G.armed=G.armed===id?null:id;
      }
      break;
  }
}
function startGame(L){
  if(L===1&&mode==='menu'&&save.level===1)score=0;
  newLevel(L);mode='intro';
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();
  const [x,y]=toL(e);
  const id=hitBtn(x,y);
  if(id){press(id);down=false;return;}
  if(mode!=='play')return;
  down=true;
  downOnFrog=Math.hypot(x-G.sx,y-PY0-G.sy)<46;
  if(!downOnFrog)aimAt(x,y);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(mode!=='play')return;
  const [x,y]=toL(e);
  if(down&&!downOnFrog)aimAt(x,y);
  else if(e.pointerType==='mouse'&&!down)aimAt(x,y);
});
cv.addEventListener('pointerup',e=>{
  if(!down)return;down=false;
  if(mode!=='play')return;
  const [x,y]=toL(e);
  if(downOnFrog&&Math.hypot(x-G.sx,y-PY0-G.sy)<46){swap();return;}
  aimAt(x,y);fire();
});
cv.addEventListener('pointercancel',()=>{down=false;});
addEventListener('keydown',e=>{
  if(!G)return;
  if(e.key===' '){fire();}
  if(e.key==='p'||e.key==='Escape'){if(mode==='play')mode='pause';else if(mode==='pause')mode='play';}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')mode='pause';});
window.__pause=()=>{if(mode==='play')mode='pause';};
window.__back=()=>{
  if(mode==='play'){mode='pause';return true;}
  if(mode==='pause'){mode='play';return true;}
  if(mode==='win'||mode==='lose'||mode==='intro'){mode='menu';return true;}
  return false;
};

/* ================= RESIZE / LOOP ================= */
function resize(){
  const iw=innerWidth,ih=innerHeight;
  H=Math.max(900,Math.min(1150,W*ih/iw));
  scale=Math.min(iw/W,ih/H);
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
  PY0=150+Math.max(0,(H-150-130-HB)/2);
  makeSprites();
  if(G)buildBg();
}
addEventListener('resize',resize);
let last=0;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(mode!=='menu'&&mode!=='pause')update(dt);else t+=dt;
  draw();
  requestAnimationFrame(loop);
}

/* ================= BOT + AUTOTEST (solo per collaudo) ================= */
function botAim(){
  const cur=G.cur;let best=null,bs=-1;
  for(let i=0;i<balls.length;i++){
    const b=balls[i];if(b.d<8||b.y+PY0<150||b.y+PY0>H-150)continue;
    const a=Math.atan2(b.y-G.sy,b.x-G.sx),dx=Math.cos(a),dy=Math.sin(a);
    let x=G.sx,y=G.sy,hit=-1;
    for(let l=0;l<1100&&hit<0;l+=6){x+=dx*6;y+=dy*6;
      for(let j=0;j<balls.length;j++){const q=balls[j];if(q.d>0&&Math.hypot(q.x-x,q.y-y)<D*.88){hit=j;break;}}}
    if(hit<0||balls[hit].color!==cur)continue;
    let run=1,k=hit;while(k>0&&balls[k-1].color===cur)k--;let m=hit;while(m<balls.length-1&&balls[m+1].color===cur)m++;
    run=m-k+1;
    const sc=run*100+balls[hit].d*0.01;
    if(sc>bs){bs=sc;best=a;}
  }
  if(best===null&&balls.length){
    let b=null;for(let i=balls.length-1;i>=0;i--){if(balls[i].d>10&&balls[i].y+PY0>150&&balls[i].y+PY0<H-150){b=balls[i];break;}}
    if(!b)b=balls[0];best=Math.atan2(b.y-G.sy,b.x-G.sx);}
  return best;
}
function sim(L,maxT,reaction){
  score=0;newLevel(L);mode='play';
  let tt=0;const dt=1/30;let shots=0;
  while(tt<maxT&&mode==='play'){
    update(dt);tt+=dt;
    if(G.cd<=0&&projs.length<2&&balls.length){const a=botAim();if(a!==null){G.ang=a;fire();shots++;G.cd=reaction;}}
  }
  return {L,res:mode==='win'?'VINTO':mode==='lose'?'PERSO':'timeout',time:Math.round(tt),shots,score,cleared:Math.round(G.destroyed/G.P.n*100)+'%',len:Math.round(PLEN),colors:G.P.colors,n:G.P.n,speed:Math.round(G.P.speed)};
}
const qs=new URLSearchParams(location.search);
resize();
if(qs.has('selftest')){
  const lv=(qs.get('levels')||'1,2,3,4,5,8,12,16,20,30').split(',').map(Number);
  const rt=parseFloat(qs.get('rt')||'0.35');
  const out=lv.map(L=>sim(L,300,rt));
  document.getElementById('out').textContent=JSON.stringify(out);
  document.title='DONE';
}else if(qs.has('shot')){
  const L=+qs.get('shot'),tm=+(qs.get('t')||6);
  score=0;newLevel(L);mode='play';
  const dt=1/30;let tt=0;
  while(tt<tm&&mode==='play'){update(dt);tt+=dt;if(G.cd<=0&&projs.length===0&&balls.length){const a=botAim();if(a!==null){G.ang=a;fire();G.cd=.4;}}}
  if(qs.has('arm'))G.armed=qs.get('arm');
  if(qs.has('menu'))mode='menu';
  if(qs.has('win')){mode='win';G.bonus='fire';}
  draw();document.title='SHOT '+innerWidth+'x'+innerHeight+' s='+scale+' cv='+cv.width+'x'+cv.height;
  document.getElementById('out').textContent=cv.toDataURL('image/png');
}else{
  requestAnimationFrame(loop);
}
})();
</script>
