<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d6fe0">
<title>Marble Rush</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1b3a;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif}
#c,#ui{position:absolute;display:block}
#c{touch-action:none}
#ui{pointer-events:none;color:#78350f}
.dim{position:absolute;inset:0;background:rgba(8,20,55,.55);display:flex;align-items:center;justify-content:center}
.panel{width:23em;max-width:92%;box-sizing:border-box;background:linear-gradient(#fffbeb,#fde68a);border:.18em solid #b45309;border-radius:1.2em;padding:1em 1.1em 1.1em;text-align:center;box-shadow:0 .5em 1.6em rgba(0,0,0,.45)}
.logo{font-size:3em;line-height:.95;font-weight:900;color:#fff;-webkit-text-stroke:.07em #1d4ed8;text-shadow:0 .08em 0 #1e3a8a,0 .2em .3em rgba(0,0,0,.35);margin:.1em 0 .25em;letter-spacing:.04em}
h1{margin:.1em 0 .3em;font-size:1.9em;line-height:1.05;color:#92400e}
.sub{font-size:.95em;margin:.4em 0;color:#78350f;font-weight:700}
.small{font-size:.75em;margin:.5em 0 0;color:#92400e;font-weight:700;opacity:.85}
.stars{color:#f59e0b;font-size:1.3em;letter-spacing:.1em;text-shadow:0 .05em 0 #b45309}
.stars.big{font-size:3em;margin:.1em 0}
.lvl{display:flex;align-items:center;justify-content:space-between;margin:.5em 0;font-size:1.2em;font-weight:900}
.arr{border:none;width:2.2em;height:2.2em;border-radius:50%;background:linear-gradient(#60a5fa,#2563eb);color:#fff;font-size:1em;font-weight:900;box-shadow:0 .15em 0 #1e40af}
.btn{display:block;width:100%;margin:.55em 0;padding:.6em .4em;border:none;border-radius:.9em;font-size:1.25em;font-weight:900;color:#fff;font-family:inherit;background:linear-gradient(#34d399,#059669);box-shadow:0 .2em 0 #047857;text-shadow:0 .06em 0 rgba(0,0,0,.25)}
.btn:active,.arr:active{transform:translateY(.12em);box-shadow:none}
.btn.alt{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 .2em 0 #1e40af}
.btn.gray{background:linear-gradient(#a8a29e,#78716c);box-shadow:0 .2em 0 #57534e}
.btn.small{font-size:.9em;padding:.55em .3em}
.row{display:flex;gap:.5em}.row .btn{margin:.3em 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
/* Marble Rush - core logic (no DOM). Original game code. */
(function (root) {
  'use strict';
  const W = 720, FH = 1280, R = 24, D = 48, STEP = 2, EPS = 0.6;
  const COLORS = ['#ef4444', '#22c55e', '#38bdf8', '#fb923c', '#a855f7', '#facc15'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- geometry helpers ---------- */
  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function norm(x, y) { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }

  function roundPoly(v, r) {
    const out = [v[0]];
    for (let i = 1; i < v.length - 1; i++) {
      const p = v[i - 1], c = v[i], n = v[i + 1];
      const a = norm(p[0] - c[0], p[1] - c[1]), b = norm(n[0] - c[0], n[1] - c[1]);
      const la = dist(p, c), lb = dist(n, c);
      const ra = Math.min(r, la * 0.48), rb = Math.min(r, lb * 0.48);
      const bis = norm(a[0] + b[0], a[1] + b[1]);
      const rr = Math.min(ra, rb);
      out.push([c[0] + a[0] * ra, c[1] + a[1] * ra]);
      out.push([c[0] + bis[0] * rr * 0.42, c[1] + bis[1] * rr * 0.42]);
      out.push([c[0] + b[0] * rb, c[1] + b[1] * rb]);
    }
    out.push(v[v.length - 1]);
    return out;
  }

  // centripetal Catmull-Rom (Barry-Goldman)
  function cr(p0, p1, p2, p3, t) {
    const t0 = 0, t1 = t0 + Math.sqrt(dist(p0, p1)), t2 = t1 + Math.sqrt(dist(p1, p2)), t3 = t2 + Math.sqrt(dist(p2, p3));
    const u = t1 + (t2 - t1) * t;
    const mix = (a, b, ta, tb) => {
      const k = (tb - ta) === 0 ? 0 : (u - ta) / (tb - ta);
      return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
    };
    const A1 = mix(p0, p1, t0, t1), A2 = mix(p1, p2, t1, t2), A3 = mix(p2, p3, t2, t3);
    const B1 = mix(A1, A2, t0, t2), B2 = mix(A2, A3, t1, t3);
    return mix(B1, B2, t1, t2);
  }

  function buildPath(ptsIn) {
    const pts = [ptsIn[0]];
    for (let i = 1; i < ptsIn.length; i++) if (dist(ptsIn[i], pts[pts.length - 1]) > 0.5) pts.push(ptsIn[i]);
    const n = pts.length;
    const first = [2 * pts[0][0] - pts[1][0], 2 * pts[0][1] - pts[1][1]];
    const last = [2 * pts[n - 1][0] - pts[n - 2][0], 2 * pts[n - 1][1] - pts[n - 2][1]];
    const P = [first].concat(pts, [last]);
    const poly = [];
    for (let i = 0; i < n - 1; i++) {
      const cnt = Math.max(4, Math.ceil(dist(pts[i], pts[i + 1]) / 6));
      for (let s = 0; s < cnt; s++) poly.push(cr(P[i], P[i + 1], P[i + 2], P[i + 3], s / cnt));
    }
    poly.push(pts[n - 1]);
    const cum = [0];
    for (let i = 1; i < poly.length; i++) cum.push(cum[i - 1] + dist(poly[i], poly[i - 1]));
    const total = cum[cum.length - 1];
    const M = Math.floor(total / STEP) + 1;
    const xs = new Float32Array(M), ys = new Float32Array(M);
    let j = 0;
    for (let k = 0; k < M; k++) {
      const target = k * STEP;
      while (j < poly.length - 2 && cum[j + 1] < target) j++;
      const seg = cum[j + 1] - cum[j] || 1;
      const f = Math.min(1, Math.max(0, (target - cum[j]) / seg));
      xs[k] = poly[j][0] + (poly[j + 1][0] - poly[j][0]) * f;
      ys[k] = poly[j][1] + (poly[j + 1][1] - poly[j][1]) * f;
    }
    const L = (M - 1) * STEP;
    const tx = new Float32Array(M), ty = new Float32Array(M);
    for (let i = 0; i < M; i++) {
      const a = Math.max(0, i - 2), b = Math.min(M - 1, i + 2);
      const t = norm(xs[b] - xs[a], ys[b] - ys[a]);
      tx[i] = t[0]; ty[i] = t[1];
    }
    return {
      xs, ys, tx, ty, M, L,
      pos(d, out) {
        out = out || {};
        if (d <= 0) { out.x = xs[0] + tx[0] * d; out.y = ys[0] + ty[0] * d; return out; }
        if (d >= L) { out.x = xs[M - 1] + tx[M - 1] * (d - L); out.y = ys[M - 1] + ty[M - 1] * (d - L); return out; }
        const f = d / STEP, i = Math.floor(f), fr = f - i;
        out.x = xs[i] + (xs[i + 1] - xs[i]) * fr;
        out.y = ys[i] + (ys[i + 1] - ys[i]) * fr;
        return out;
      },
      tan(d, out) {
        out = out || {};
        const i = Math.max(0, Math.min(M - 1, Math.round(d / STEP)));
        out.x = tx[i]; out.y = ty[i];
        return out;
      }
    };
  }

  /* ---------- level templates (field 720 x 1280) ---------- */
  function spiralPts(a0, turns, dir, fEnd, rx, ry) {
    const pts = [], cx = 360, cy = 650, N = Math.round(turns * 50);
    for (let i = 0; i <= N; i++) {
      const t = i / N, a = a0 + dir * t * turns * Math.PI * 2, f = 1.0 - (1 - fEnd) * t;
      pts.push([cx + rx * f * Math.cos(a), cy + ry * f * Math.sin(a)]);
    }
    return pts;
  }

  const TEMPLATES = [
    { name: 'Serpente', shooter: [360, 1030], round: 57, verts: [[-60, 290], [630, 290], [630, 410], [90, 410], [90, 530], [630, 530], [630, 650], [90, 650], [90, 770], [630, 770], [630, 890], [200, 890]] },
    { name: 'Anello', shooter: [360, 690], round: 80, verts: [[-60, 290], [630, 290], [630, 1010], [90, 1010], [90, 430], [500, 430], [500, 880], [230, 880], [230, 560]] },
    { name: 'Spirale', shooter: [360, 650], round: 0, verts: spiralPts(-2.4, 1.85, 1, 0.55, 330, 400), raw: true },
    { name: 'Ovale', shooter: [360, 650], round: 0, verts: spiralPts(-0.8, 2.3, -1, 0.42, 335, 410), raw: true },
    { name: 'Onde', shooter: [360, 1040], round: 48, verts: [[-60, 280], [620, 280], [620, 380], [100, 380], [100, 480], [620, 480], [620, 580], [100, 580], [100, 680], [620, 680], [620, 780], [100, 780], [100, 880], [560, 880]] },
    { name: 'Labirinto', shooter: [315, 720], round: 70, verts: [[-60, 280], [660, 280], [660, 1040], [60, 1040], [60, 370], [570, 370], [570, 950], [150, 950], [150, 460], [480, 460], [480, 600]] }
  ];

  const THEMES = [
    { name: 'Deserto', top: '#fde68a', bot: '#f5b95c', edge: '#b9792f', fill: '#e9bb6a', deco: '#e0a443', deco2: '#fff3c4' },
    { name: 'Prato', top: '#bbf7d0', bot: '#6ee7a0', edge: '#8a5a1f', fill: '#d9ad63', deco: '#4ade80', deco2: '#ecfccb' },
    { name: 'Neve', top: '#e0f2fe', bot: '#a5d8f7', edge: '#7a8da6', fill: '#e9f1fa', deco: '#bfe3f9', deco2: '#ffffff' },
    { name: 'Vulcano', top: '#7f2d2d', bot: '#3b1621', edge: '#292524', fill: '#78716c', deco: '#a33a2a', deco2: '#f97316' },
    { name: 'Notte', top: '#312e81', bot: '#161449', edge: '#1e1b4b', fill: '#6366f1', deco: '#4338ca', deco2: '#c7d2fe' }
  ];

  const pathCache = {};
  function makePath(level) {
    const ti = (level - 1) % TEMPLATES.length;
    const flip = Math.floor((level - 1) / TEMPLATES.length) % 2 === 1;
    const key = ti + ':' + flip;
    if (!pathCache[key]) {
      const T = TEMPLATES[ti];
      let pts = T.raw ? T.verts.slice() : roundPoly(T.verts, T.round);
      let sh = T.shooter.slice();
      if (flip) { pts = pts.map(p => [W - p[0], p[1]]); sh = [W - sh[0], sh[1]]; }
      pathCache[key] = { path: buildPath(pts), shooter: sh, name: T.name };
    }
    const c = pathCache[key];
    return { path: c.path, shooter: c.shooter, name: c.name, theme: THEMES[(level - 1) % THEMES.length], themeIndex: (level - 1) % THEMES.length };
  }

  function levelParams(L, path) {
    const colors = L <= 2 ? 3 : L <= 5 ? 4 : L <= 10 ? 5 : 6;
    const speed = L < 27 ? 38 + 3.2 * L : Math.min(190, 124 + (L - 27) * 1.4);
    let count = Math.round(20 + 2.6 * L);
    count = Math.min(count, Math.floor(path.L * 0.62 / D));
    const cluster = Math.max(0, 0.5 - 0.04 * L);
    return {
      colors, speed, count, cluster,
      surge: L >= 14,
      guide: L <= 8 ? 1 : Math.max(0.22, 1 - (L - 8) * 0.06),
      target: count * 28
    };
  }

  /* ---------- core ---------- */
  class Core {
    constructor(level) {
      this.level = level;
      const t = makePath(level);
      this.path = t.path; this.shooter = { x: t.shooter[0], y: t.shooter[1] };
      this.theme = t.theme; this.themeIndex = t.themeIndex; this.tmplName = t.name;
      const P = levelParams(level, this.path); this.P = P;
      this.rng = mulberry32(level * 977 + 31);
      this.chain = []; this.shots = []; this.events = [];
      this.score = 0; this.combo = 0; this.maxCombo = 0;
      this.state = 'playing'; this.time = 0; this.cool = 0; this.armed = null;
      this.angle = -Math.PI / 2; this.winTimer = 0;
      this.surgeTimer = 10 + this.rng() * 6; this.surging = 0;
      this.tmp = {}; this.tmp2 = {};
      const cols = [];
      for (let i = 0; i < P.count; i++) {
        let c;
        do {
          c = Math.floor(this.rng() * P.colors);
          if (i > 0 && this.rng() < P.cluster) c = cols[i - 1];
        } while (i >= 2 && cols[i - 1] === c && cols[i - 2] === c);
        cols.push(c);
      }
      for (let i = 0; i < P.count; i++) {
        const d = -i * D;
        this.chain.push({ c: cols[i], d, vd: d, ox: 0, oy: 0, gapped: false, pull: false });
      }
      this.cur = this.pickColor(); this.next = this.pickColor();
    }

    pickColor() {
      const present = [];
      for (const b of this.chain) if (b.d > -R && present.indexOf(b.c) < 0) present.push(b.c);
      if (!present.length) for (const b of this.chain) if (present.indexOf(b.c) < 0) present.push(b.c);
      if (!present.length) return 0;
      return present[Math.floor(Math.random() * present.length)];
    }

    setAim(x, y) { this.angle = Math.atan2(y - this.shooter.y, x - this.shooter.x); }
    swap() { const t = this.cur; this.cur = this.next; this.next = t; this.events.push({ t: 'swap' }); }

    fire() {
      if (this.state !== 'playing' || this.cool > 0) return false;
      const sh = this.shooter, a = this.angle, sp = 1700;
      const type = this.armed || 'ball';
      this.shots.push({ x: sh.x + Math.cos(a) * 50, y: sh.y + Math.sin(a) * 50, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, c: this.cur, type });
      this.armed = null;
      if (type === 'ball') { this.cur = this.next; this.next = this.pickColor(); }
      this.cool = 0.2;
      this.events.push({ t: 'shoot', type });
      return type;
    }

    update(dt) {
      if (dt > 0.05) dt = 0.05;
      this.time += dt; this.cool = Math.max(0, this.cool - dt);
      const ch = this.chain;
      if (this.state === 'playing') {
        this.updateChain(dt);
        this.updateShots(dt);
        if (ch.length && ch[0].d >= this.path.L) { this.state = 'dying'; this.armed = null; for (let i = ch.length - 1; i >= 0; i--) if (ch[i].d < -R) ch.splice(i, 1); this.events.push({ t: 'dying' }); }
        else if (!ch.length) { this.state = 'clearing'; this.winTimer = 0.9; }
      } else if (this.state === 'dying') {
        for (let i = ch.length - 1; i >= 0; i--) {
          ch[i].d += 1500 * dt;
          if (ch[i].d >= this.path.L + R) {
            const p = this.path.pos(this.path.L, this.tmp);
            this.events.push({ t: 'sink', x: p.x, y: p.y, c: ch[i].c });
            ch.splice(i, 1);
          }
        }
        if (!ch.length) { this.state = 'lost'; this.events.push({ t: 'lost' }); }
      } else if (this.state === 'clearing') {
        this.updateShots(dt);
        this.winTimer -= dt;
        if (this.winTimer <= 0) { this.state = 'won'; this.events.push({ t: 'won' }); }
      }
      const k = Math.min(1, dt * 18), dec = Math.exp(-dt * 16);
      for (const b of ch) { b.vd += (b.d - b.vd) * k; b.ox *= dec; b.oy *= dec; if (b.fresh) b.fresh = Math.max(0, b.fresh - dt * 4); }
    }

    updateChain(dt) {
      const ch = this.chain, n = ch.length, P = this.P, L = this.path.L;
      if (!n) return;
      if (P.surge) {
        if (this.surging > 0) this.surging -= dt;
        else { this.surgeTimer -= dt; if (this.surgeTimer <= 0) { this.surging = 1.4; this.surgeTimer = 13 + this.rng() * 9; this.events.push({ t: 'surge' }); } }
      }
      const mult = this.surging > 0 ? 1.9 : 1;
      const att = (i) => ch[i - 1].d - ch[i].d <= D + EPS;
      for (let i = 1; i < n; i++) if (!att(i)) ch[i].gapped = true;
      const segs = []; let s = 0;
      for (let i = 1; i <= n; i++) { if (i === n || !att(i)) { segs.push([s, i - 1]); s = i; } }
      for (let k = 0; k < segs.length; k++) {
        const a = segs[k][0], b = segs[k][1];
        let shift = 0;
        if (k === segs.length - 1) {
          const rush = 700 * Math.max(0, Math.min(1, 1 - ch[a].d / (0.25 * L)));
          shift = (P.speed * mult + rush) * dt;
          if (a > 0) { const room = ch[a - 1].d - D - ch[a].d; if (shift > room) shift = Math.max(0, room); }
        } else if (ch[b].pull) {
          const room = (ch[b + 1].d + D) - ch[b].d;
          shift = room < 0 ? Math.max(-420 * dt, room) : 0;
        }
        if (shift !== 0) for (let i = a; i <= b; i++) ch[i].d += shift;
      }
      const merges = [];
      for (let i = 1; i < n; i++) {
        if (att(i)) {
          if (ch[i].gapped) { ch[i].gapped = false; ch[i - 1].pull = false; if (ch[i - 1].c === ch[i].c) merges.push(ch[i]); }
        }
      }
      for (const ball of merges) {
        const idx = ch.indexOf(ball);
        if (idx > 0 && ch[idx - 1].c === ball.c) this.resolveMatch(idx);
      }
    }

    resolveMatch(i) {
      const ch = this.chain, c = ch[i].c;
      let a = i, b = i;
      while (a > 0 && ch[a - 1].c === c && ch[a - 1].d - ch[a].d <= D + EPS) a--;
      while (b < ch.length - 1 && ch[b + 1].c === c && ch[b].d - ch[b + 1].d <= D + EPS) b++;
      const cnt = b - a + 1;
      if (cnt < 3) return false;
      this.combo++; if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      const pts = Math.round((cnt * 10 + Math.max(0, cnt - 3) * 10) * (1 + 0.5 * (this.combo - 1)));
      this.score += pts;
      for (let k = a; k <= b; k++) { const p = this.ballPos(ch[k]); this.events.push({ t: 'pop', x: p.x, y: p.y, c: ch[k].c }); }
      const mp = this.ballPos(ch[Math.floor((a + b) / 2)]);
      this.events.push({ t: 'score', x: mp.x, y: mp.y, pts, combo: this.combo, cnt });
      ch.splice(a, cnt);
      this.afterRemoval();
      return true;
    }

    ballPos(b) { const p = this.path.pos(b.vd, {}); p.x += b.ox; p.y += b.oy; return p; }

    afterRemoval() {
      const ch = this.chain;
      for (let i = 1; i < ch.length; i++) {
        if (ch[i - 1].d - ch[i].d > D + EPS) { ch[i].gapped = true; ch[i - 1].pull = ch[i - 1].c === ch[i].c; }
      }
    }

    updateShots(dt) {
      const ch = this.chain, path = this.path, tmp = this.tmp;
      for (let s = this.shots.length - 1; s >= 0; s--) {
        const sh = this.shots[s]; let hit = -1;
        for (let k = 0; k < 3 && hit < 0; k++) {
          sh.x += sh.vx * dt / 3; sh.y += sh.vy * dt / 3;
          let best = -1, bd = 1e9;
          for (let i = 0; i < ch.length; i++) {
            const b = ch[i]; if (b.vd < -R * 0.2) continue;
            path.pos(b.vd, tmp);
            const dx = sh.x - tmp.x - b.ox, dy = sh.y - tmp.y - b.oy, dd = dx * dx + dy * dy;
            if (dd < bd) { bd = dd; best = i; }
          }
          if (best >= 0 && bd < (D * 0.86) * (D * 0.86)) hit = best;
        }
        if (hit >= 0) { this.shots.splice(s, 1); this.onHit(sh, hit); continue; }
        if (sh.x < -300 || sh.x > W + 300 || sh.y < -300 || sh.y > FH + 300) this.shots.splice(s, 1);
      }
    }

    removeWhere(pred, pts) {
      const ch = this.chain; let cnt = 0, sx = 0, sy = 0;
      for (let i = ch.length - 1; i >= 0; i--) {
        if (ch[i].vd > -R * 0.2 && pred(ch[i])) {
          const p = this.ballPos(ch[i]); sx += p.x; sy += p.y; cnt++;
          this.events.push({ t: 'pop', x: p.x, y: p.y, c: ch[i].c });
          ch.splice(i, 1);
        }
      }
      if (cnt) {
        this.combo = 1; const add = cnt * pts; this.score += add;
        this.events.push({ t: 'score', x: sx / cnt, y: sy / cnt, pts: add, combo: 1, cnt });
        this.afterRemoval();
      }
      return cnt;
    }

    onHit(sh, j) {
      const ch = this.chain, path = this.path;
      const hb = ch[j], hp = this.ballPos(hb);
      if (sh.type === 'fire' || sh.type === 'bomb') {
        this.events.push({ t: 'boom', x: hp.x, y: hp.y, type: sh.type });
        if (sh.type === 'fire') {
          const col = hb.c;
          this.removeWhere(b => { const p = this.ballPos(b); return b.c === col && Math.hypot(p.x - hp.x, p.y - hp.y) < 300; }, 15);
        } else {
          this.removeWhere(b => { const p = this.ballPos(b); return Math.hypot(p.x - hp.x, p.y - hp.y) < 175; }, 15);
        }
        return;
      }

    if (screen !== 'playing' || !game) return;
    const p = toLogical(e);
    if (swapCand) { if (Math.hypot(p.x - game.shooter.x, p.y - offY - game.shooter.y) < 70) game.swap(); swapCand = false; return; }
    aim(p);
    const armed = game.armed, t = game.fire();
    if (t && armed && t === armed) { save.boost[armed] = Math.max(0, save.boost[armed] - 1); persist(); }
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', function () { aimDown = false; swapCand = false; });

  /* ---------- events -> effects ---------- */
  function burst(x, y, col, n, spd, life) {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * spd; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: (life || 0.6) * (0.6 + Math.random() * 0.6), col, r: 3 + Math.random() * 5 }); }
  }
  function processEvents() {
    const ev = game.events;
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i];
      if (e.t === 'pop') { burst(e.x, e.y, COLORS[e.c], 7, 260); sfx.pop(game.combo); }
      else if (e.t === 'score') {
        floats.push({ x: e.x, y: e.y, t: 0, text: '+' + e.pts, col: '#fff', size: 38 + Math.min(e.combo, 6) * 3 });
        if (e.combo >= 2) floats.push({ x: e.x, y: e.y - 44, t: 0, text: 'Combo x' + e.combo + '!', col: '#fde047', size: 36 });
        else if (e.cnt >= 5) floats.push({ x: e.x, y: e.y - 44, t: 0, text: 'Grande!', col: '#fde047', size: 34 });
      }
      else if (e.t === 'shoot') { if (e.type === 'ball') sfx.shoot(); else { sfx.boom(); } }
      else if (e.t === 'insert') sfx.insert();
      else if (e.t === 'boom') { burst(e.x, e.y, e.type === 'fire' ? '#fb923c' : '#fde047', 36, 520, 0.8); shake = 14; flash = 0.35; }
      else if (e.t === 'surge') { banner = { t: 0, text: 'Ondata!', sub: 'Le palline accelerano' }; sfx.warn(); flash = 0.3; }
      else if (e.t === 'sink') burst(e.x, e.y, COLORS[e.c], 4, 160, 0.5);
      else if (e.t === 'won') onWin();
      else if (e.t === 'lost') onLost();
    }
    ev.length = 0;
  }

  /* ---------- drawing ---------- */
  function drawFrog(g) {
    const s = g.shooter, a = g.angle;
    ctx.save(); ctx.translate(s.x, s.y);
    ctx.fillStyle = 'rgba(0,0,0,.22)'; circle(ctx, 3, 6, 64); ctx.fill();
    const pg = ctx.createRadialGradient(-14, -18, 8, 0, 0, 64); pg.addColorStop(0, '#e2e8f0'); pg.addColorStop(1, '#94a3b8');
    ctx.fillStyle = pg; circle(ctx, 0, 0, 62); ctx.fill(); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = 'rgba(100,116,139,.5)'; ctx.lineWidth = 3; circle(ctx, 0, 0, 50); ctx.stroke();
    ctx.rotate(a + Math.PI / 2);
    // legs
    ctx.fillStyle = '#4d7c0f'; ctx.strokeStyle = '#365314'; ctx.lineWidth = 3.5;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 36, 22, 17, 10, sx * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    // body
    const bgd = ctx.createRadialGradient(-10, -14, 6, 0, 0, 52); bgd.addColorStop(0, '#a3e635'); bgd.addColorStop(1, '#65a30d');
    ctx.fillStyle = bgd; ctx.beginPath(); ctx.ellipse(0, -2, 40, 44, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d9f99d'; ctx.beginPath(); ctx.ellipse(0, 10, 25, 24, 0, 0, Math.PI * 2); ctx.fill();
    spr(g.next, 0, 34, 0.7);
    // eyes
    for (const sx of [-1, 1]) {
      ctx.fillStyle = '#a3e635'; circle(ctx, sx * 25, -34, 15); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; circle(ctx, sx * 25, -35, 10); ctx.fill(); ctx.fillStyle = '#111'; circle(ctx, sx * 25, -39, 5.5); ctx.fill();
    }
    ctx.restore();
    // ball in the mouth
    const mx = s.x + Math.cos(a) * 46, my = s.y + Math.sin(a) * 46;
    const k = g.armed ? g.armed : g.cur;
    ctx.save(); ctx.translate(mx, my);
    if (g.armed) { ctx.globalAlpha = 0.5 + 0.3 * Math.sin(performance.now() / 120); ctx.fillStyle = g.armed === 'bomb' ? '#fde047' : g.armed === 'fire' ? '#fb923c' : '#ffffff'; circle(ctx, 0, 0, R + 9); ctx.fill(); ctx.globalAlpha = 1; }
    ctx.restore(); spr(k, mx, my, 1);
  }
  function drawAimGuide(g) {
    if (g.state !== 'playing') return;
    const s = g.shooter, a = g.angle, len = 560 * g.P.guide, col = g.armed ? '#ffffff' : COLORS[g.cur];
    ctx.fillStyle = col;
    for (let d = 80, n = 0; d < 80 + len; d += 28, n++) { ctx.globalAlpha = 0.65 * (1 - (d - 80) / len); circle(ctx, s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, 4.5); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  function drawTunnel(g) {
    const p = g.path; if (p.xs[0] < 20 || p.xs[0] > W - 20) return;
    const x = p.xs[0], y = p.ys[0], t = { x: p.tx[0], y: p.ty[0] };
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(t.y, t.x));
    ctx.fillStyle = '#57534e'; ctx.beginPath(); ctx.arc(0, 0, 50, Math.PI / 2, -Math.PI / 2); ctx.lineTo(-10, -50); ctx.lineTo(-10, 50); ctx.fill();
    ctx.fillStyle = '#78716c'; ctx.beginPath(); ctx.arc(0, 0, 42, Math.PI / 2, -Math.PI / 2); ctx.lineTo(-10, -42); ctx.lineTo(-10, 42); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#1c1917'; circle(ctx, x - t.x * 18, y - t.y * 18, 30); ctx.fill();
    ctx.fillStyle = '#78716c'; ctx.beginPath(); ctx.ellipse(x - t.x * 52, y - t.y * 52, 38, 52, Math.atan2(t.y, t.x), 0, Math.PI * 2); ctx.fill();
  }
  function drawHUD() {
    // top bar
    const g = ctx.createLinearGradient(0, 0, 0, 180); g.addColorStop(0, '#3b9cff'); g.addColorStop(1, '#1d6fe0');
    ctx.fillStyle = 'rgba(0,0,0,.18)'; rrect(ctx, -20, -20, W + 40, 206, 40); ctx.fill();
    ctx.fillStyle = g; rrect(ctx, -20, -20, W + 40, 200, 40); ctx.fill();
    txt('PUNTI', 40, 42, 24, '#cfe6ff', 'left'); txt(String(game.score), 40, 90, 54, '#fff', 'left', 6, '#0b3a8a');
    txt('LIVELLO', W - 40, 42, 24, '#cfe6ff', 'right'); txt(String(game.level), W - 40, 90, 54, '#fff', 'right', 6, '#0b3a8a');
    // progress bar
    const bx = 40, bw = W - 80, by = 140;
    ctx.fillStyle = '#0a2c6e'; rrect(ctx, bx, by - 13, bw, 26, 13); ctx.fill();
    const f = game.fill();
    if (f > 0.01) { const fg = ctx.createLinearGradient(bx, 0, bx + bw, 0); fg.addColorStop(0, '#fde047'); fg.addColorStop(1, '#fb923c'); ctx.fillStyle = fg; rrect(ctx, bx, by - 13, Math.max(26, bw * f), 26, 13); ctx.fill(); }
    [0.5, 0.7, 0.92].forEach(p => {
      const sx = bx + bw * p; ctx.fillStyle = f >= p ? '#fde047' : '#7aa7e6'; ctx.strokeStyle = f >= p ? '#b45309' : '#1e4fa8'; ctx.lineWidth = 3;
      starPath(ctx, sx, by + 24, 17); ctx.fill(); ctx.stroke();
    });
  }
  function drawBottom() {
    const y = boostY();
    for (const b of BOOST) {
      const n = save.boost[b.k], armed = game.armed === b.k;
      ctx.save(); ctx.globalAlpha = n > 0 ? 1 : 0.5;
      if (armed) { ctx.fillStyle = 'rgba(255,255,255,.65)'; circle(ctx, b.x, y, 66 + 3 * Math.sin(performance.now() / 150)); ctx.fill(); }
      ctx.fillStyle = 'rgba(0,0,0,.22)'; circle(ctx, b.x + 2, y + 5, 54); ctx.fill();
      const cg = ctx.createLinearGradient(0, y - 54, 0, y + 54); cg.addColorStop(0, '#fff7ed'); cg.addColorStop(1, '#fcd9a0');
      ctx.fillStyle = cg; circle(ctx, b.x, y, 54); ctx.fill(); ctx.strokeStyle = '#d97706'; ctx.lineWidth = 5; ctx.stroke();
      spr(b.k, b.x, y - 2, 1.2);
      ctx.restore();
      ctx.fillStyle = '#fff'; circle(ctx, b.x + 40, y + 40, 20); ctx.fill(); ctx.strokeStyle = '#d97706'; ctx.lineWidth = 4; ctx.stroke();
      txt(String(n), b.x + 40, y + 41, 26, '#92400e');
      txt(b.lbl, b.x, y + 76, 24, '#fff', 'center', 6);
    }
    ctx.fillStyle = 'rgba(0,0,0,.22)'; circle(ctx, 632, y + 5, 46); ctx.fill();
    const pg = ctx.createLinearGradient(0, y - 46, 0, y + 46); pg.addColorStop(0, '#60b4ff'); pg.addColorStop(1, '#1d6fe0');
    ctx.fillStyle = pg; circle(ctx, 630, y, 46); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = '#fff'; rrect(ctx, 614, y - 18, 11, 36, 4); ctx.fill(); rrect(ctx, 636, y - 18, 11, 36, 4); ctx.fill();
  }

  let last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (!game) return;
    if (screen === 'playing' || game.state === 'dying' && screen !== 'menu' && screen !== 'paused') { game.update(dt); }
    if (screen === 'playing' || screen === 'lost' || screen === 'won') processEvents(); else game.events.length = 0;
    // fx update
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life += dt; if (p.life > p.max) { parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy = p.vy * 0.94 + 260 * dt; }
    for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.t += dt; if (f.t > 1.1) floats.splice(i, 1); }
    if (banner) { banner.t += dt; if (banner.t > 1.9) banner = null; }
    shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt);
    dangerPulse += dt;
    render();
  }

  function render() {
    const g = game, path = g.path;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    if (bg) ctx.drawImage(bg, 0, 0, W, H);
    ctx.save();
    ctx.translate((Math.random() - 0.5) * shake, offY + (Math.random() - 0.5) * shake);
    // danger glow near the hole
    if (g.chain.length && g.chain[0].d > path.L * 0.8 && g.state === 'playing') {
      const hp = path.pos(path.L, {}); ctx.fillStyle = 'rgba(239,68,68,' + (0.2 + 0.15 * Math.sin(dangerPulse * 9)) + ')'; circle(ctx, hp.x, hp.y, 90); ctx.fill();
    }
    // chain
    const tmp = {};
    for (let i = g.chain.length - 1; i >= 0; i--) {
      const b = g.chain[i]; if (b.vd < -R) continue;
      path.pos(b.vd, tmp); const sc2 = 1 + 0.22 * (b.fresh || 0);
      spr(b.c, tmp.x + b.ox, tmp.y + b.oy, sc2);
    }
    drawTunnel(g);
    drawAimGuide(g);
    drawFrog(g);
    for (const s of g.shots) { if (s.type === 'ball') spr(s.c, s.x, s.y, 1); else { spr(s.type, s.x, s.y, 1.1); burst(s.x, s.y, s.type === 'fire' ? '#fb923c' : s.type === 'bomb' ? '#9ca3af' : '#fff', 1, 60, 0.3); } }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.fillStyle = p.col; circle(ctx, p.x, p.y, p.r * (1 - p.life / p.max * 0.5)); ctx.fill(); }
    ctx.globalAlpha = 1;
    for (const f of floats) { const k = f.t / 1.1; ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3; txt(f.text, f.x, f.y - k * 60, f.size, f.col, 'center', 7, 'rgba(60,30,0,.65)'); }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.5, flash) + ')'; ctx.fillRect(0, 0, W, H); }
    if (screen !== 'menu') { drawHUD(); drawBottom(); }
    if (banner && screen === 'playing') {
      const k = banner.t / 1.9, a = k < 0.15 ? k / 0.15 : k > 0.75 ? Math.max(0, 1 - (k - 0.75) / 0.25) : 1;
      ctx.globalAlpha = a; txt(banner.text, W / 2, H / 2 - 40 - (1 - a) * 20, 96, '#fff', 'center', 14, 'rgba(0,40,100,.8)'); if (banner.sub) txt(banner.sub, W / 2, H / 2 + 40, 42, '#fde047', 'center', 9, 'rgba(0,40,100,.8)'); ctx.globalAlpha = 1;
    }
  }

  /* ---------- boot ---------- */
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    H = Math.round(Math.max(1280, Math.min(1760, vh / vw * W)));
    cssScale = Math.min(vw / W, vh / H);
    const cw = W * cssScale, ch = H * cssScale, left = (vw - cw) / 2, top = (vh - ch) / 2;
    for (const el of [cv, ui]) { el.style.width = cw + 'px'; el.style.height = ch + 'px'; el.style.left = left + 'px'; el.style.top = top + 'px'; }
    sc = cssScale * (window.devicePixelRatio || 1);
    cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
    offY = (H - FH) / 2;
    ui.style.fontSize = (cssScale * 24) + 'px';
    buildSprites(); buildBg();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('contextmenu', e => e.preventDefault());
  selLevel = save.level;
  resize(); showMenu(); requestAnimationFrame(frame);
  window.__mr = { get game() { return game; }, startLevel, save: () => save, get screen() { return screen; } };
})();

</script>
</body>
