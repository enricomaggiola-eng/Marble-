name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
            - name: SDK Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Crea progetto Android
        run: |
          set -e
          mkdir -p proj/app/src/main/java/it/marblerush proj/app/src/main/assets proj/app/src/main/res/drawable
          cp index.html proj/app/src/main/assets/index.html
          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'MarbleRush'
          include ':app'
          EOF
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF
          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'it.marblerush'
              compileSdk 34

              defaultConfig {
                  applicationId 'it.marblerush'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Marble Rush"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > proj/app/src/main/java/it/marblerush/MainActivity.java <<'EOF'
          package it.marblerush;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0b2236"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);           // localStorage: salva livello e record
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setLongClickable(false);
                  web.setHapticFeedbackEnabled(false);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.evaluateJavascript("window.__pause&&window.__pause()", null);
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.__back?window.__back():false)", v -> {
                      if (!"true".equals(v)) finish();
                  });
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          EOF
          cat > proj/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#19C3FF" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0A9FF0" android:pathData="M0,70h108v38h-108z"/>
              <path android:fillColor="#F03A3A" android:pathData="M30,40m-17,0a17,17 0,1 1,34 0a17,17 0,1 1,-34 0"/>
              <path android:fillColor="#FFE83F" android:pathData="M60,34m-17,0a17,17 0,1 1,34 0a17,17 0,1 1,-34 0"/>
              <path android:fillColor="#44D63A" android:pathData="M78,62m-17,0a17,17 0,1 1,34 0a17,17 0,1 1,-34 0"/>
              <path android:fillColor="#B04CF2" android:pathData="M42,70m-17,0a17,17 0,1 1,34 0a17,17 0,1 1,-34 0"/>
              <path android:fillColor="#55FFFFFF" android:pathData="M24,33m-5,0a5,3 0,1 1,10 0a5,3 0,1 1,-10 0"/>
          </vector>
          EOF
      - name: Compila APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MarbleRush-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
